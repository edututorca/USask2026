<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz - EduShare</title>
    <link rel="stylesheet" href="css/user-area.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/my-quiz.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="logo-container">
            <img src="assets/EduShare_Logo.png" alt="EduShare Logo" class="logo">
        </div>
        <div class="top-bar-right">
            <button class="icon-btn" onclick="window.location.href='help.html'" title="Help">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
                </svg>
            </button>
            <div class="profile-menu">
                <button class="profile-btn" onclick="toggleProfileMenu()">
                    <svg width="24" height="24" fill="currentColor">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="Account.html">Account Settings</a>
                    <a href="profile.html">My Profile</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
            <button class="hamburger-menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Sidebar Menu -->
    <div class="side-menu" id="sideMenu">
        <nav class="menu-nav">
            <a href="dashboard.html" class="menu-item">
                <svg width="20" height="20" fill="currentColor"><rect width="8" height="8" rx="2"/><rect x="12" width="8" height="8" rx="2"/><rect y="12" width="8" height="8" rx="2"/><rect x="12" y="12" width="8" height="8" rx="2"/></svg>
                Dashboard
            </a>
            <a href="my-courses.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                My Courses
            </a>
            <a href="User-Area.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                Question Bank
            </a>
            <a href="quiz-manager.html" class="menu-item active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                My Quizzes
            </a>
            <a href="browse-quizzes.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Browse Quizzes
            </a>
            <a href="question-creator.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Question
            </a>
            <a href="ai-question-creator.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                AI Question Generator
            </a>
            <a href="help.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
                Help
            </a>
        </nav>
    </div>

    <!-- Success Banner -->
    <div class="save-banner" id="saveBanner">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        Saved!
    </div>

    <div class="quiz-edit-container">
        <div class="quiz-header">
            <h1 id="quizName">Loading...</h1>
            <div class="quiz-meta" id="quizMeta"></div>
            <div class="quiz-actions-bar">
                <button class="action-btn btn-primary" onclick="openAddQuestionsModal()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add Questions
                </button>
                <button class="action-btn btn-secondary" onclick="openPrintPreview('student')">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </svg>
                    Print Student Version
                </button>
                <button class="action-btn btn-secondary" onclick="openPrintPreview('answer-key')">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    Print Answer Key
                </button>
                <button class="action-btn btn-primary" onclick="saveQuiz()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save Changes
                </button>
            </div>
        </div>

        <div class="questions-container">
            <div class="questions-header">
                <h2>Quiz Questions</h2>
                <span id="questionCount" class="questions-summary">0 questions &bull; 0 points</span>
            </div>
            <div class="questions-list" id="questionsList"></div>
        </div>
    </div>

    <!-- Sticky Footer -->
    <div class="sticky-footer" id="stickyFooter">
        <div class="footer-left" id="footerSummary">0 questions &bull; 0 points</div>
        <div class="footer-right">
            <button class="action-btn btn-secondary" onclick="openPrintPreview('student')">Print Student</button>
            <button class="action-btn btn-secondary" onclick="openPrintPreview('answer-key')">Print Answer Key</button>
            <button class="action-btn btn-primary" onclick="saveQuiz()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                Save Changes
            </button>
        </div>
    </div>

    <!-- Add Questions Modal -->
    <div class="modal" id="addQuestionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Questions to Quiz</h3>
                <button class="close-modal" onclick="closeAddQuestionsModal()">&times;</button>
            </div>
            <div class="modal-search">
                <input type="text" id="questionSearchInput" class="search-input" placeholder="Search by topic, keyword, or question text..." oninput="filterQuestionBank()">
            </div>
            <div id="questionBankList"></div>
            <div class="modal-actions">
                <button class="action-btn btn-secondary" onclick="closeAddQuestionsModal(); openCreateModal();">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
                    </svg>
                    Create New Question
                </button>
                <div style="flex:1;"></div>
                <button class="action-btn btn-secondary" onclick="closeAddQuestionsModal()">Cancel</button>
                <button class="action-btn btn-primary" onclick="addSelectedQuestions()">Add Selected Questions</button>
            </div>
        </div>
    </div>

    <!-- Edit / Create Question Modal -->
    <div class="modal" id="editQuestionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editModalTitle">Edit Question</h3>
                <button class="close-modal" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="edit-form">
                <input type="hidden" id="editQuestionId">
                <label class="edit-field">
                    <span>Question Text</span>
                    <textarea id="editQuestionText" rows="3"></textarea>
                </label>
                <div class="edit-row">
                    <label class="edit-field">
                        <span>Question Type</span>
                        <select id="editQuestionType" onchange="toggleEditOptions()">
                            <option value="multiple_choice">Multiple Choice</option>
                            <option value="true_false">True/False</option>
                            <option value="short_answer">Short Answer</option>
                            <option value="essay">Essay</option>
                        </select>
                    </label>
                    <label class="edit-field">
                        <span>Difficulty</span>
                        <select id="editDifficulty">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </label>
                </div>
                <div id="editOptionsContainer">
                    <label class="edit-field"><span>Option A</span><input type="text" id="editOptionA"></label>
                    <label class="edit-field"><span>Option B</span><input type="text" id="editOptionB"></label>
                    <label class="edit-field"><span>Option C</span><input type="text" id="editOptionC"></label>
                    <label class="edit-field"><span>Option D</span><input type="text" id="editOptionD"></label>
                </div>
                <label class="edit-field">
                    <span>Correct Answer</span>
                    <input type="text" id="editCorrectAnswer">
                </label>
            </div>
            <div class="modal-actions">
                <button class="action-btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="action-btn btn-primary" onclick="saveEditedQuestion()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Print Preview Modal -->
    <div class="modal print-preview-modal" id="printPreviewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="printPreviewTitle">Print Preview</h3>
                <button class="close-modal" onclick="closePrintPreview()">&times;</button>
            </div>
            <div class="print-preview" id="printPreviewContent"></div>
            <div class="modal-actions">
                <button class="action-btn btn-secondary" onclick="closePrintPreview()">Close</button>
                <button class="action-btn btn-primary" onclick="window.print()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </svg>
                    Print
                </button>
            </div>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile-link.js"></script>
    <script src="js/my-quiz.js"></script>
</body>
</html>
