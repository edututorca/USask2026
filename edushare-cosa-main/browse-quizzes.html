<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Community Quizzes - EduShare</title>
    <link rel="stylesheet" href="user-area.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/browse-quizzes.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="logo-container">
            <img src="EduShare_Logo.png" alt="EduShare Logo" class="logo">
        </div>
        <div class="top-bar-right">
            <button class="icon-btn" onclick="window.location.href='help.html'" title="Help">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
                </svg>
            </button>
            <div class="profile-menu">
                <button class="profile-btn" onclick="toggleProfileMenu()">
                    <svg width="24" height="24" fill="currentColor">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="Account.html">Account Settings</a>
                    <a href="profile.html">My Profile</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
            <button class="hamburger-menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Sidebar Menu -->
    <div class="side-menu" id="sideMenu">
        <nav class="menu-nav">
            <a href="dashboard.html" class="menu-item">
                <svg width="20" height="20" fill="currentColor"><rect width="8" height="8" rx="2"/><rect x="12" width="8" height="8" rx="2"/><rect y="12" width="8" height="8" rx="2"/><rect x="12" y="12" width="8" height="8" rx="2"/></svg>
                Dashboard
            </a>
            <a href="Add-course.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                My Courses
            </a>
            <a href="User-Area.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                Question Bank
            </a>
            <a href="quiz-manager.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                My Quizzes
            </a>
            <a href="browse-quizzes.html" class="menu-item active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Browse Quizzes
            </a>
            <a href="question-creator.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Question
            </a>
            <a href="ai-question-creator.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                AI Question Generator
            </a>
            <a href="help.html" class="menu-item">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
                Help
            </a>
        </nav>
    </div>

    <div class="browse-container">
        <div class="page-header">
            <h1>Community Quizzes</h1>
            <p>Browse and copy quizzes shared by other teachers</p>
        </div>

        <!-- Filters -->
        <div class="filters-bar">
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="searchInput" placeholder="Search quiz titles..." oninput="filterQuizzes()">
            </div>
            <div class="filter-group">
                <label>Subject</label>
                <select id="subjectFilter" onchange="filterQuizzes()">
                    <option value="">All Subjects</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Grade Level</label>
                <select id="gradeFilter" onchange="filterQuizzes()">
                    <option value="">All Grades</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort By</label>
                <select id="sortFilter" onchange="filterQuizzes()">
                    <option value="recent">Most Recent</option>
                    <option value="rating">Highest Rated</option>
                    <option value="popular">Most Copied</option>
                </select>
            </div>
        </div>

        <!-- Quizzes Grid -->
        <div class="quizzes-grid" id="quizzesGrid"></div>
    </div>

    <!-- Success Toast -->
    <div id="successToast" class="success-toast">Quiz copied to your account!</div>

    <!-- Report Modal -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <h3>Report Quiz</h3>
            <form id="reportForm">
                <div class="form-group">
                    <label>Reason</label>
                    <select id="reportReason" required>
                        <option value="">Select a reason...</option>
                        <option value="inappropriate">Inappropriate Content</option>
                        <option value="incorrect">Incorrect Information</option>
                        <option value="copyright">Copyright Violation</option>
                        <option value="spam">Spam</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Additional Details (Optional)</label>
                    <textarea id="reportMessage" placeholder="Provide more information..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="action-btn btn-secondary" onclick="closeReportModal()">Cancel</button>
                    <button type="submit" class="action-btn btn-primary">Submit Report</button>
                </div>
            </form>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="profile-link.js"></script>
    <script src="js/browse-quizzes.js"></script>
</body>
</html>
