<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EduShare — Plays</title>
    <!-- Main app stylesheet -->
    <link rel="stylesheet" href="css/styles.css"/>

    <style>
        /* --- KEBAB STYLES --- */
        .kebab-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .kebab-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .kebab-menu {
            display: none;
            background: #1f2a44;
            border-radius: 6px;
            position: absolute;
            margin-top: 5px;
            padding: 10px;
            width: 120px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 999;
        }

        .kebab-menu.show {
            display: block;
        }

        .kebab-item {
            padding: 6px;
            cursor: pointer;
            color: white;
        }

        .kebab-item:hover {
            opacity: 0.6;
        }
    </style>
</head>
<body>

<!--  TOP BAR  -->
<header class="topbar">
    <div class="topbar__left">
        <!-- Brand -->
        <a class="brand" href="home.html" aria-label="Go to EduShare home">
            <img src="./assets/EduShare_Logo.png" alt="EduShare logo" class="brand__logo" />
            <span class="brand__name">EduShare</span>
        </a>

        <nav class="primary-nav" aria-label="Primary">
            <button id="btnOpenPlays" class="nav-link" type="button">Plays</button>
            <a class="nav-link" href="#">Novel</a>
            <a class="nav-link" href="#">Grammar</a>
            <a class="nav-link" href="#">Project</a>
            <a class="nav-link" href="#">Speech</a>
        </nav>
    </div>

    <div class="topbar__right">
        <button class="icon-btn" aria-label="Help">?</button>
        <button class="icon-btn" aria-label="Messages">💬</button>
        <div class="plan-pill">Plans</div>
        <div class="user-chip">
            <div class="avatar" aria-hidden="true">D</div>
            <div class="user-chip__txt">
                <div class="user-name">Dan Maia</div>
                <div class="user-points">XP: <strong>142</strong></div>
            </div>
        </div>
    </div>
</header>


<!--  MAIN LAYOUT  -->
<div class="layout">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" aria-label="Sidebar">
        <div class="profile-card">
            <div class="avatar large" aria-hidden="true">D</div>
            <div class="profile-meta">
                <div class="profile-name">Daniel</div>
                <div class="profile-role">Instructor</div>
            </div>
        </div>

        <div class="sidebar-block">

            <!-- NEW: WRAP TITLE + KEBAB -->
            <div class="kebab-wrapper">
                <div class="block-title">My Courses:</div>

                <!-- NEW: KEBAB BUTTON -->
                <button class="kebab-btn" id="coursesMenuBtn">⋮</button>
            </div>

            <!-- NEW: DROPDOWN -->
            <div class="kebab-menu" id="coursesMenu">
                <div class="kebab-item">Archive</div>
                <div class="kebab-item">Delete</div>
            </div>

            <ul class="course-list">
                <li><span class="dot bg-green"></span>English</li>
                <li><span class="dot bg-blue"></span>Math</li>
                <li><span class="dot bg-purple"></span>Science</li>
                <li><span class="dot bg-gray"></span>Introduction to Bus...</li>
            </ul>

            <button class="btn btn-outline small full">+ Add another course</button>
        </div>

        <div class="sidebar-block sticky-bottom">
            <!-- REMOVED ARCHIVE HERE -->
            <button class="btn btn-muted full">Profile</button>
            <button id="btnLogout" class="btn btn-muted full">Log Out</button>
        </div>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- ROW 1 — PLAYS -->
        <section id="rowPlays" class="row row-plays" aria-label="Plays row">
            <div id="playsBar" class="plays-bar"></div>
        </section>

        <!-- ROW 2 — ACTS -->
        <section id="rowActs" class="row row-acts" aria-label="Acts row">
            <button class="tab tab--act" data-act="1">Act 1</button>
            <button class="tab tab--act" data-act="2">Act 2</button>
            <button class="tab tab--act active" data-act="3">Act 3</button>
            <button class="tab tab--act" data-act="4">Act 4</button>
            <button class="tab tab--act" data-act="5">Act 5</button>
        </section>

        <!-- ROW 3 — SCENES -->
        <section id="rowScenes" class="row row-scenes" aria-label="Scenes row">
            <button class="tab tab--scene" data-scene="1">Scene 1</button>
            <button class="tab tab--scene" data-scene="2">Scene 2</button>
            <button class="tab tab--scene" data-scene="3">Scene 3</button>
            <button class="tab tab--scene active" data-scene="4">Scene 4</button>
            <button class="tab tab--scene" data-scene="5">Scene 5</button>
        </section>

        <!-- CONTENT AREA -->
        <section id="contentArea" class="content" aria-label="Questions content">

            <!-- Toolbar -->
            <div class="toolbar">
                <div class="left">
                    <button class="btn btn-orange-pill">Randomize</button>
                    <button class="btn btn-orange-outline">Filter</button>
                </div>

                <div class="center">
                    <div class="search">
                        <input id="searchInput" type="text" placeholder="Search Content"/>
                        <button id="btnSearch" type="button" class="magnifier">🔍</button>
                    </div>
                </div>

                <div class="right">
                    <button class="btn btn-warning">Worksheet</button>
                    <button class="btn btn-warning">Quiz</button>
                    <button class="btn btn-warning">Games</button>
                </div>
            </div>

            <!-- Select all -->
            <div class="select-strip">
                <button class="btn btn-select-all">Select All</button>
            </div>
        </section>
    </main>
</div>

<script>
    // TOGGLE MENU
    document.getElementById("coursesMenuBtn").addEventListener("click", () => {
        document.getElementById("coursesMenu").classList.toggle("show");
    });

    // CLOSE MENU WHEN CLICKING OUTSIDE
    document.addEventListener("click", (e) => {
        const menu = document.getElementById("coursesMenu");
        const btn = document.getElementById("coursesMenuBtn");

        if (!menu.contains(e.target) && !btn.contains(e.target)) {
            menu.classList.remove("show");
        }
    });
</script>

<!-- Other scripts -->
<script src="js/plays-bar.js"></script>
<script src="js/restore-context.js"></script>
<script src="js/plays-flow.js"></script>
<script src="js/add-question-link.js"></script>
<script src="js/auto-last-saved.js"></script>
<script src="js/delete-question.js"></script>
<script src="js/load-saved-questions.js"></script>
<script src="js/inject-new-question.js"></script>
<script src="js/search-question.js"></script>
<script src="js/logout.js"></script>

</body>
</html>
