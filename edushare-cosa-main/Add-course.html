<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - EduShare</title>
    <link rel="stylesheet" href="css/user-area.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/Add-course.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div class="top-bar">
                <div class="logo-container">
            <img src="assets/EduShare_Logo.png" alt="EduShare Logo" class="logo">
            <span class="logo-text">EduShare</span>
        </div>
        <div class="top-bar-right">
                        <button class="icon-btn" onclick="window.location.href='help.html'" title="Help">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <circle cx="12" cy="17" r="1" fill="currentColor"/>
                </svg>
            </button>
                        <div class="profile-menu">
                <button class="profile-btn" onclick="toggleProfileMenu()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                    </svg>
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="Account.html">Account Settings</a>
                    <a href="profile.html">My Profile</a>
                    <a href="#" onclick="logout()">Logout</a>
                </div>
            </div>
            <button class="hamburger-menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

        <!-- Sidebar Menu -->
    <div class="side-menu" id="sideMenu">
        <nav class="menu-nav">
            <a href="dashboard.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
                Dashboard
            </a>
            <a href="my-courses.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                My Courses
            </a>
            <a href="User-Area.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
                Question Bank
            </a>
            <a href="quiz-manager.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                My Quizzes
            </a>
            <a href="browse-quizzes.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Browse Quizzes
            </a>
            <a href="question-creator.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Question
            </a>
            <a href="ai-question-creator.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
                AI Question Generator
            </a>
            <a href="help.html" class="menu-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
                Help
            </a>
        </nav>
    </div>

    <!-- Success Banner -->
    <div class="save-banner" id="saveBanner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="bannerText">Course added!</span>
    </div>

    <div class="add-course-container">
        <a href="my-courses.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to My Courses
        </a>

        <div class="form-card">
            <div class="header">
                <h1>Add a Course</h1>
                <p>Set up your class in seconds</p>
            </div>

            <form id="addCourseForm">
                <!-- Category -->
               <div class="form-group">
                  <label for="categorySelect">Subject <span class="required">*</span></label>
                  <select id="categorySelect" required>
                 <option value="">Select a subject</option>
                  </select>
                 </div>

                <!-- Course Code + Section -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="courseCodeInput">Course Code <span class="required">*</span></label>
                        <div class="autocomplete-wrapper">
                            <input type="text" id="courseCodeInput" placeholder="e.g., ENG1D, MPM2D..." autocomplete="off" required>
                            <div class="autocomplete-dropdown" id="courseCodeDropdown"></div>
                        </div>
                        <small>Ontario course code — type to search</small>
                    </div>
                    <div class="form-group">
                        <label for="sectionTag">Section <span class="label-optional">(optional)</span></label>
                        <input type="text" id="sectionTag" placeholder="e.g., A, B, Period 1...">
                        <small>Label for your class section</small>
                    </div>
                </div>

                <!-- Course code info -->
                <div class="code-info" id="codeInfo"></div>

                <!-- Actions -->
                <div class="button-group">
                    <a href="my-courses.html" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Course
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile-link.js"></script>
    <script src="js/Add-course.js"></script>
</body>
</html>
